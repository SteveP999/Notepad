<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1a1a;--surface:#242424;--surface2:#2e2e2e;--surface3:#383838;
  --border:#383838;--text:#e8e8e8;--dim:#888;--dimmer:#555;
  --accent:#c8952a;--accent2:#7a5a19;--danger:#8b3030;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
#shell{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:280px;min-width:160px;max-width:580px;flex-shrink:0;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative;border-right:1px solid var(--border);}
#drag-handle{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:20;}
#drag-handle:hover{background:var(--accent);opacity:.5;}
#sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.stab{flex:1;padding:10px 4px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;color:var(--dim);border:none;background:none;letter-spacing:.5px;text-transform:uppercase;}
.stab.active{color:var(--accent);border-bottom:2px solid var(--accent);}
#sidebar-body{flex:1;overflow-y:auto;padding:8px 10px 14px;}
#sidebar-body::-webkit-scrollbar{width:4px;}
#sidebar-body::-webkit-scrollbar-thumb{background:var(--border);}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
#app-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex-shrink:0;}
#search-wrap{flex:1;position:relative;max-width:260px;}
#search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;padding:5px 8px;outline:none;}
#search:focus{border-color:var(--accent);}
#search::placeholder{color:var(--dimmer);}
#btn-new{margin-left:auto;background:var(--accent);color:#111;border:none;border-radius:4px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;flex-shrink:0;}

#savebar{display:flex;align-items:center;gap:6px;padding:4px 12px;background:#1e1e1e;border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0;}
#save-status{flex:1;font-size:11px;}
.sav-btn{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:2px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;}
.sav-btn:hover,.sav-btn.primary{border-color:var(--accent);color:var(--accent);}

/* NOTE TABS */
#tabs-row{display:flex;background:#1e1e1e;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin;}
.tab{display:flex;align-items:center;cursor:pointer;border-right:1px solid var(--border);color:var(--dim);background:#1e1e1e;max-width:180px;min-width:70px;}
.tab:hover{background:var(--surface2);color:var(--text);}
.tab.active{background:var(--surface2);color:var(--text);border-bottom:2px solid var(--accent);}
.tab-label{flex:1;padding:7px 8px 7px 10px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;}
.tab-input{display:none;flex:1;background:var(--surface3);border:none;outline:none;color:var(--text);font-size:12px;padding:7px 4px 7px 8px;font-family:var(--font);min-width:0;}
.tab.renaming .tab-label{display:none;}
.tab.renaming .tab-input{display:block;}
.tab-x{padding:7px 7px 7px 2px;font-size:14px;color:var(--dimmer);cursor:pointer;}
.tab-x:hover{color:#f66;}

/* NOTE META + TOOLBAR */
#note-toolbar{padding:5px 12px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.tool-btn{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:2px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;}
.tool-btn:hover{border-color:var(--accent);color:var(--accent);}
#note-tags{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.tag-chip{font-size:10px;background:var(--accent2);border:1px solid var(--accent);color:var(--text);border-radius:10px;padding:1px 8px;cursor:pointer;}
.tag-chip:hover{background:var(--danger);}
#tag-add-btn{font-size:10px;background:none;border:1px dashed var(--border);color:var(--dimmer);border-radius:10px;padding:1px 8px;cursor:pointer;}
#tag-add-btn:hover{border-color:var(--accent);color:var(--accent);}

/* TAG PICKER DROPDOWN */
#tag-picker{position:absolute;background:var(--surface2);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:200;padding:6px;min-width:160px;display:none;}
#tag-picker.show{display:block;}
.tag-opt{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;}
.tag-opt:hover{background:var(--surface3);}
.tag-opt input{accent-color:var(--accent);}

#note-meta{padding:4px 14px;font-size:11px;color:var(--dimmer);border-bottom:1px solid var(--border);background:var(--surface);display:flex;gap:14px;align-items:center;flex-shrink:0;}

/* EDITOR */
#editor-wrap{flex:1;display:flex;overflow:hidden;position:relative;}
#editor-area{flex:1;overflow-y:auto;padding:18px 22px;outline:none;font-family:var(--mono);font-size:14px;line-height:1.8;color:var(--text);background:var(--bg);white-space:pre-wrap;word-break:break-word;}
#editor-area:empty:before{content:attr(data-placeholder);color:var(--dimmer);}
#editor-area img{max-width:100%;border-radius:4px;margin:6px 0;display:block;cursor:pointer;}
#editor-area img.selected{outline:2px solid var(--accent);}
#editor-area.dragover{background:var(--surface2);}
#preview{flex:1;overflow-y:auto;padding:18px 22px;font-size:14px;line-height:1.7;display:none;color:var(--text);}
#preview h1{font-size:20px;margin:0 0 10px;color:var(--accent);}
#preview h2{font-size:16px;margin:14px 0 6px;color:var(--accent);}
#preview h3{font-size:14px;margin:12px 0 5px;color:#ccc;}
#preview p{margin:0 0 8px;}
#preview strong{color:#fff;}
#preview em{color:#bbb;}
#preview code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--accent);}
#preview pre{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:10px;margin:8px 0;overflow-x:auto;}
#preview ul,#preview ol{margin:0 0 8px 18px;}
#preview li{margin-bottom:3px;}
#preview blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--dim);margin:8px 0;}
#preview hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
#preview a{color:var(--accent);}
#preview img{max-width:100%;border-radius:4px;margin:6px 0;}

#statusbar{display:flex;align-items:center;padding:3px 14px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--dimmer);flex-shrink:0;}
#mode-toggle{display:flex;gap:2px;background:var(--surface2);border-radius:4px;padding:2px;margin-left:auto;}
.mode-btn{background:none;border:none;color:var(--dim);font-size:11px;padding:2px 10px;border-radius:3px;cursor:pointer;}
.mode-btn.active{background:var(--accent);color:#111;font-weight:700;}

/* LISTS PANEL */
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;}
.panel-hdr h3{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
.add-btn{background:var(--accent);color:#111;border:none;border-radius:4px;font-size:16px;font-weight:700;width:22px;height:22px;cursor:pointer;line-height:1;flex-shrink:0;}
.name-row{display:flex;gap:5px;margin-bottom:8px;}
.name-row input{flex:1;background:var(--surface2);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:12px;padding:5px 7px;outline:none;min-width:0;}
.name-row .ok{background:var(--accent);color:#111;border:none;border-radius:4px;font-size:12px;font-weight:700;padding:4px 8px;cursor:pointer;}
.name-row .cancel{background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;font-size:12px;padding:4px 8px;cursor:pointer;}

/* LIST CARDS */
.lcard{border:1px solid var(--border);border-radius:6px;margin-bottom:7px;overflow:hidden;}
.lcard-hdr{display:flex;align-items:center;gap:5px;padding:6px 8px;background:var(--surface2);cursor:pointer;user-select:none;}
.lcard-tog{font-size:9px;color:var(--dim);flex-shrink:0;width:12px;}
.lcard-name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lcard-stat{font-size:10px;color:var(--dim);flex-shrink:0;}
.lcard-acts{display:flex;gap:1px;flex-shrink:0;}
.lc-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:11px;padding:2px 4px;border-radius:3px;line-height:1;}
.lc-btn:hover{background:var(--surface3);color:var(--text);}
.lc-btn.del:hover{background:var(--danger);color:#fff;}
.lcard-body{padding:6px 8px 8px;background:var(--bg);display:none;}
.lcard.open .lcard-body{display:block;}

/* LIST INNER TABS (Items / Notes / Sections) */
.list-tabs{display:flex;gap:3px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.list-tab{font-size:10px;padding:2px 10px;border-radius:3px;cursor:pointer;border:1px solid var(--border);color:var(--dim);background:none;}
.list-tab.active{background:var(--accent2);border-color:var(--accent);color:var(--text);font-weight:700;}

/* SECTION FILTER */
.section-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.sec-chip{font-size:10px;padding:2px 8px;border-radius:10px;cursor:pointer;border:1px solid var(--border);color:var(--dim);background:none;}
.sec-chip.active{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700;}

/* TREE */
.tree-hint{font-size:10px;color:var(--dimmer);margin-bottom:6px;}
.tnode{position:relative;}
.tnode-row{display:flex;align-items:center;gap:3px;padding:2px 2px;border-radius:3px;min-height:24px;}
.tnode-row:hover{background:var(--surface2);}
.tnode-row:hover .tnode-acts{opacity:1;}
.tnode-tog{width:13px;height:13px;flex-shrink:0;font-size:9px;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px;}
.tnode-tog:hover{background:var(--surface3);}
.tnode-cb{accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;cursor:pointer;}
.tnode-lbl{flex:1;font-size:12px;line-height:1.4;word-break:break-word;padding:1px 2px;}
.tnode-lbl.done{text-decoration:line-through;color:var(--dim);}
.tnode-sec{font-size:10px;color:var(--accent);margin-left:4px;flex-shrink:0;}
.tnode-inp{flex:1;background:var(--surface3);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:12px;padding:2px 5px;outline:none;font-family:var(--font);}
.tnode-acts{opacity:0;display:flex;gap:1px;flex-shrink:0;transition:opacity .1s;}
.ta-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:11px;padding:1px 3px;border-radius:2px;line-height:1;}
.ta-btn:hover{background:var(--surface3);color:var(--text);}
.ta-btn.del:hover{background:var(--danger);color:#fff;}
.tnode-children{margin-left:15px;border-left:1px solid var(--border);padding-left:2px;}
.add-row{display:flex;gap:4px;margin:3px 0 3px 0px;}
.add-row.child{margin-left:15px;}
.add-row input{flex:1;background:var(--surface2);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:11px;padding:3px 6px;outline:none;}
.add-row .ok{background:var(--accent);color:#111;border:none;border-radius:3px;font-size:12px;font-weight:700;width:22px;cursor:pointer;}
.add-row .cancel{background:none;border:1px solid var(--border);color:var(--dim);border-radius:3px;font-size:11px;width:22px;cursor:pointer;}
.add-top-btn{width:100%;text-align:left;background:none;border:1px dashed var(--border);color:var(--dimmer);font-size:11px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-top:5px;}
.add-top-btn:hover{border-color:var(--accent);color:var(--accent);}

/* LINKED NOTES IN LIST */
.linked-note-item{padding:6px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);margin-bottom:4px;background:var(--surface2);}
.linked-note-item:hover{border-color:var(--accent);}
.linked-note-name{font-size:12px;font-weight:600;}
.linked-note-preview{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MOBILE */
#mobile-nav{display:none;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);}
.mnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 4px;background:none;border:none;color:var(--dim);font-size:10px;cursor:pointer;}
.mnav-btn.active{color:var(--accent);}
#mobile-panel{display:none;flex:1;overflow:hidden;flex-direction:column;}
#mobile-panel-inner{flex:1;overflow-y:auto;padding:0 10px 14px;}

@media(max-width:700px){
  #sidebar,#main{display:none!important;}
  #mobile-nav{display:flex;}
  #mobile-panel{display:flex;}
  body{flex-direction:column;}
  #shell{flex:1;overflow:hidden;display:flex;flex-direction:column;}
}
@media(min-width:701px){
  #mobile-nav,#mobile-panel{display:none!important;}
  #main,#sidebar{display:flex;}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar">
    <div id="drag-handle"></div>
    <div id="sidebar-tabs">
      <button class="stab active" id="stab-lists">Lists</button>
      <button class="stab" id="stab-notes">Notes</button>
    </div>
    <div id="sidebar-body">
      <div id="side-lists"></div>
      <div id="side-notes-panel" style="display:none"></div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="app-title">Notepad</div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Search notes…" autocomplete="off">
      </div>
      <button id="btn-new">+ New Note</button>
    </div>
    <div id="savebar">
      <span id="save-status">Not connected to Dropbox</span>
      <button class="sav-btn primary" id="btn-dbx-save">☁ Save</button>
      <button class="sav-btn primary" id="btn-dbx-load">☁ Load</button>
      <button class="sav-btn" id="btn-backup">⬇ Backup</button>
      <button class="sav-btn" id="btn-restore">⬆ Restore</button>
      <input type="file" id="file-in" accept=".json" style="display:none">
    </div>
    <div id="tabs-row"></div>
    <div id="note-toolbar">
      <button class="tool-btn" id="btn-img">📷 Image</button>
      <input type="file" id="img-in" accept="image/*" style="display:none">
      <button class="tool-btn" id="btn-dl">↓ .txt</button>
      <div id="note-tags">
        <span style="font-size:10px;color:var(--dimmer);">Tags:</span>
        <div id="tag-chips"></div>
        <button id="tag-add-btn">+ tag</button>
      </div>
    </div>
    <div id="note-meta">
      <span id="meta-created"></span>
      <span id="meta-words">0 words</span>
      <span id="meta-chars">0 chars</span>
    </div>
    <div id="editor-wrap">
      <div id="editor-area" contenteditable="true" data-placeholder="Start typing… drag & drop images here"></div>
      <div id="preview"></div>
    </div>
    <div id="statusbar">
      <div id="mode-toggle">
        <button class="mode-btn active" id="btn-edit">Edit</button>
        <button class="mode-btn" id="btn-prev">Preview</button>
      </div>
    </div>
  </div>
</div>

<!-- Tag picker dropdown -->
<div id="tag-picker"></div>

<div id="mobile-nav">
  <button class="mnav-btn active" id="mnav-lists">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Lists
  </button>
  <button class="mnav-btn" id="mnav-notes">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Notes
  </button>
</div>
<div id="mobile-panel"><div id="mobile-panel-inner"></div></div>

<script>
const SK='npv5', DBX_KEY='x8otifau2aup4hr', DBX_PATH='/notepad-data.json';
const REDIR=location.origin+location.pathname;

let S={notes:[],activeId:null,lists:[]};
let dbxToken=localStorage.getItem('npv5_dbx')||null;
let saveTimer=null, editorMode='edit', sideTab='lists', mobileTab_='lists';
let renamingNote=null, editingNode=null, addingTo=null, listForm=null;
let activeListTab={}, activeSec={};// listId -> 'items'|'notes'|'sections'
let tagPickerOpen=false;

function persist(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function sched(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,700);}
function uid(){return '_'+Math.random().toString(36).slice(2,11);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setStatus(msg,color){const el=document.getElementById('save-status');if(el){el.textContent=msg;el.style.color=color||'';}}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  try{const r=localStorage.getItem(SK);if(r)S=JSON.parse(r);}catch(e){}
  if(!Array.isArray(S.notes))S.notes=[];
  if(!Array.isArray(S.lists))S.lists=[];
  // Migrate old notes to have tags array
  S.notes.forEach(n=>{if(!n.tags)n.tags=[];if(!n.html&&n.content){n.html=n.content.replace(/\n/g,'<br>');delete n.content;}});
  // Migrate old lists to have sections
  S.lists.forEach(l=>{if(!l.sections)l.sections=[];});

  if(location.hash.includes('access_token')){
    const p=new URLSearchParams(location.hash.slice(1));
    const t=p.get('access_token');
    if(t){dbxToken=t;localStorage.setItem('npv5_dbx',t);}
    history.replaceState(null,'',location.pathname);
  }
  if(!S.notes.length)newNote(false);
  else renderNotes();
  renderLists();
  setStatus(dbxToken?'Dropbox connected ✓':'Not connected to Dropbox',dbxToken?'#5a9e5a':'');
  bindEvents();
  initDrag();
}

// ── DRAG HANDLE ───────────────────────────────────────────────────────────────
function initDrag(){
  const h=document.getElementById('drag-handle'),sb=document.getElementById('sidebar');
  if(!h||!sb)return;
  h.addEventListener('mousedown',function(e){
    e.preventDefault();
    const sx=e.clientX,sw=sb.offsetWidth;
    function mv(e){sb.style.width=Math.min(Math.max(sw+e.clientX-sx,160),580)+'px';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

// ── DROPBOX ───────────────────────────────────────────────────────────────────
function dbxAuth(){location.href='https://www.dropbox.com/oauth2/authorize?client_id='+DBX_KEY+'&response_type=token&redirect_uri='+encodeURIComponent(REDIR);}
async function dbxSave(){
  if(!dbxToken){dbxAuth();return;}
  saveEditorToNote();persist();setStatus('Saving…','#c8952a');
  try{
    const r=await fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH,mode:'overwrite',autorename:false}),'Content-Type':'application/octet-stream'},
      body:JSON.stringify(S)
    });
    if(r.ok)setStatus('Saved ✓ '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}),'#5a9e5a');
    else if(r.status===401){dbxToken=null;localStorage.removeItem('npv5_dbx');dbxAuth();}
    else setStatus('Save failed ('+r.status+')','#cc6060');
  }catch(e){setStatus('Error: '+e.message,'#cc6060');}
}
async function dbxLoad(){
  if(!dbxToken){dbxAuth();return;}
  setStatus('Loading…','#c8952a');
  try{
    const r=await fetch('https://content.dropboxapi.com/2/files/download',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH})}
    });
    if(r.ok){
      const d=await r.json();
      if(d.notes&&d.lists){S=d;persist();renderNotes();renderLists();setStatus('Loaded ✓','#5a9e5a');}
      else setStatus('Bad file format','#cc6060');
    }else if(r.status===409)setStatus('No save file yet — save first','#c8952a');
    else if(r.status===401){dbxToken=null;localStorage.removeItem('npv5_dbx');dbxAuth();}
    else setStatus('Load failed ('+r.status+')','#cc6060');
  }catch(e){setStatus('Error: '+e.message,'#cc6060');}
}

// Upload image to Dropbox and return shared link
async function dbxUploadImage(file){
  if(!dbxToken)return null;
  const path='/notepad-images/'+Date.now()+'-'+file.name.replace(/[^a-z0-9._-]/gi,'_');
  try{
    const up=await fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':JSON.stringify({path,mode:'overwrite',autorename:false}),'Content-Type':'application/octet-stream'},
      body:file
    });
    if(!up.ok)return null;
    const sl=await fetch('https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Content-Type':'application/json'},
      body:JSON.stringify({path,settings:{requested_visibility:'public'}})
    });
    if(!sl.ok){
      // Try get existing link
      const gl=await fetch('https://api.dropboxapi.com/2/sharing/list_shared_links',{
        method:'POST',
        headers:{'Authorization':'Bearer '+dbxToken,'Content-Type':'application/json'},
        body:JSON.stringify({path})
      });
      if(gl.ok){const gd=await gl.json();if(gd.links?.length){return gd.links[0].url.replace('?dl=0','?raw=1');}}
      return null;
    }
    const sd=await sl.json();
    return sd.url.replace('?dl=0','?raw=1');
  }catch(e){return null;}
}

function backup(){
  saveEditorToNote();persist();
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='notepad-data.json';a.click();URL.revokeObjectURL(a.href);
  setStatus('Backup downloaded','#5a9e5a');
}
function restore(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.notes&&d.lists){S=d;persist();renderNotes();renderLists();setStatus('Restored ✓','#5a9e5a');}
      else setStatus('Unrecognized file','#cc6060');
    }catch{setStatus('Could not read file','#cc6060');}
  };
  r.readAsText(f);e.target.value='';
}

// ── NOTES ─────────────────────────────────────────────────────────────────────
function newNote(focus=true){
  const n={id:uid(),name:'Untitled Note',html:'',created:new Date().toISOString(),tags:[]};
  S.notes.push(n);S.activeId=n.id;persist();
  renamingNote=focus?n.id:null;
  renderNotes();
}
function deleteNote(id){
  if(S.notes.length===1){S.notes[0].html='';S.notes[0].name='Untitled Note';S.notes[0].created=new Date().toISOString();S.notes[0].tags=[];persist();renderNotes();return;}
  const i=S.notes.findIndex(n=>n.id===id);S.notes.splice(i,1);
  if(S.activeId===id)S.activeId=S.notes[Math.min(i,S.notes.length-1)].id;
  persist();renderNotes();
}
function activeNote(){return S.notes.find(n=>n.id===S.activeId);}
function saveEditorToNote(){
  const n=activeNote(),ea=document.getElementById('editor-area');
  if(n&&ea)n.html=ea.innerHTML;
}
function switchNote(id){
  if(renamingNote)commitRename(renamingNote);
  saveEditorToNote();
  S.activeId=id;persist();renderNotes();
  if(editorMode==='edit')setTimeout(()=>document.getElementById('editor-area').focus(),30);
}
function startRename(id){
  renamingNote=id;renderTabs();
  setTimeout(()=>{const i=document.querySelector('.tab[data-id="'+id+'"] .tab-input');if(i){i.focus();i.select();}},20);
}
function commitRename(id){
  const n=S.notes.find(x=>x.id===id);
  const inp=document.querySelector('.tab[data-id="'+id+'"] .tab-input');
  if(n&&inp)n.name=inp.value.trim()||'Untitled Note';
  renamingNote=null;sched();renderTabs();renderSideNotes();
}
function renderNotes(){renderTabs();renderEditorArea();renderMeta();renderTagChips();renderSideNotes();}
function renderTabs(){
  const row=document.getElementById('tabs-row');if(!row)return;row.innerHTML='';
  S.notes.forEach(n=>{
    const tab=document.createElement('div');
    tab.className='tab'+(n.id===S.activeId?' active':'')+(n.id===renamingNote?' renaming':'');
    tab.dataset.id=n.id;
    const lbl=document.createElement('span');lbl.className='tab-label';lbl.textContent=n.name;
    lbl.addEventListener('dblclick',e=>{e.stopPropagation();startRename(n.id);});
    lbl.addEventListener('click',()=>{if(n.id!==S.activeId)switchNote(n.id);});
    const inp=document.createElement('input');inp.className='tab-input';inp.type='text';inp.value=n.name;inp.maxLength=60;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitRename(n.id);}if(e.key==='Escape'){renamingNote=null;renderTabs();}e.stopPropagation();});
    inp.addEventListener('blur',()=>commitRename(n.id));
    inp.addEventListener('click',e=>e.stopPropagation());
    const x=document.createElement('span');x.className='tab-x';x.innerHTML='×';
    x.addEventListener('click',e=>{e.stopPropagation();deleteNote(n.id);});
    tab.append(lbl,inp,x);row.appendChild(tab);
  });
  if(renamingNote){const i=document.querySelector('.tab[data-id="'+renamingNote+'"] .tab-input');if(i){i.focus();i.select();}}
}
function renderEditorArea(){
  const n=activeNote(),ea=document.getElementById('editor-area');if(!ea||!n)return;
  ea.innerHTML=n.html||'';
  updateCounts(ea.innerText||'');
  if(editorMode==='preview')renderPreview();
}
function renderMeta(){
  const n=activeNote();if(!n)return;
  const d=new Date(n.created);
  const el=document.getElementById('meta-created');if(!el)return;
  el.textContent='Created '+d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function updateCounts(t){
  const w=t.trim()?t.trim().split(/\s+/).length:0;
  document.getElementById('meta-words').textContent=w+' word'+(w!==1?'s':'');
  document.getElementById('meta-chars').textContent=t.length+' char'+(t.length!==1?'s':'');
}

// ── NOTE TAGS ─────────────────────────────────────────────────────────────────
function renderTagChips(){
  const n=activeNote();
  const chips=document.getElementById('tag-chips');if(!chips)return;
  if(!n){chips.innerHTML='';return;}
  chips.innerHTML=(n.tags||[]).map(lid=>{
    const lst=S.lists.find(l=>l.id===lid);
    return lst?'<span class="tag-chip" data-untag="'+lid+'">'+esc(lst.name)+' ×</span>':'';
  }).join('');
  chips.querySelectorAll('[data-untag]').forEach(c=>c.addEventListener('click',()=>{
    const n=activeNote();if(!n)return;
    n.tags=(n.tags||[]).filter(t=>t!==c.dataset.untag);sched();renderTagChips();renderLists();
  }));
}

function openTagPicker(){
  const n=activeNote();if(!n)return;
  const picker=document.getElementById('tag-picker');
  const btn=document.getElementById('tag-add-btn');
  const rect=btn.getBoundingClientRect();
  picker.style.top=(rect.bottom+4)+'px';
  picker.style.left=rect.left+'px';
  if(!S.lists.length){picker.innerHTML='<div style="font-size:12px;color:var(--dimmer);padding:6px 8px;">No lists yet</div>';}
  else{
    picker.innerHTML=S.lists.map(l=>'<div class="tag-opt"><input type="checkbox" '+(n.tags?.includes(l.id)?'checked':'')+' data-lid="'+l.id+'"><span>'+esc(l.name)+'</span></div>').join('');
    picker.querySelectorAll('[data-lid]').forEach(cb=>cb.addEventListener('change',()=>{
      const n=activeNote();if(!n)return;
      if(!n.tags)n.tags=[];
      if(cb.checked){if(!n.tags.includes(cb.dataset.lid))n.tags.push(cb.dataset.lid);}
      else n.tags=n.tags.filter(t=>t!==cb.dataset.lid);
      sched();renderTagChips();renderLists();
    }));
  }
  picker.classList.toggle('show');
  tagPickerOpen=picker.classList.contains('show');
}

function renderSideNotes(){
  const el=document.getElementById('side-notes-panel');if(!el)return;
  el.innerHTML='<div class="panel-hdr"><h3>All Notes</h3><button class="add-btn" id="side-new-note">+</button></div>'+
    S.notes.map(n=>'<div class="lcard'+(n.id===S.activeId?' open':'')+'" data-noteid="'+n.id+'" style="cursor:pointer">'+
      '<div class="lcard-hdr"><span class="lcard-name">'+esc(n.name)+'</span>'+
      '<div class="lcard-acts"><button class="lc-btn del" data-delnote="'+n.id+'">×</button></div></div></div>'
    ).join('');
  document.getElementById('side-new-note').addEventListener('click',()=>newNote());
  el.querySelectorAll('[data-noteid]').forEach(el=>el.addEventListener('click',()=>{switchNote(el.dataset.noteid);showSideTab('notes');}));
  el.querySelectorAll('[data-delnote]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();deleteNote(b.dataset.delnote);}));
}

// ── IMAGES ────────────────────────────────────────────────────────────────────
async function insertImageFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  setStatus('Uploading image…','#c8952a');
  if(dbxToken){
    const url=await dbxUploadImage(file);
    if(url){insertImageAtCursor(url);setStatus('Image uploaded ✓','#5a9e5a');return;}
  }
  // Fallback: base64 embed
  const reader=new FileReader();
  reader.onload=e=>{insertImageAtCursor(e.target.result);setStatus('Image embedded (local only)','#c8952a');};
  reader.readAsDataURL(file);
}
function insertImageAtCursor(src){
  const ea=document.getElementById('editor-area');ea.focus();
  const img=document.createElement('img');img.src=src;img.style.maxWidth='100%';
  const sel=window.getSelection();
  if(sel.rangeCount){
    const range=sel.getRangeAt(0);range.deleteContents();range.insertNode(img);
    range.setStartAfter(img);range.collapse(true);sel.removeAllRanges();sel.addRange(range);
  } else {ea.appendChild(img);}
  saveEditorToNote();sched();
}
function setMode(m){
  editorMode=m;
  const ea=document.getElementById('editor-area'),pv=document.getElementById('preview');
  document.getElementById('btn-edit').classList.toggle('active',m==='edit');
  document.getElementById('btn-prev').classList.toggle('active',m==='preview');
  if(m==='edit'){ea.style.display='block';pv.style.display='none';ea.focus();}
  else{renderPreview();ea.style.display='none';pv.style.display='block';}
}
function renderPreview(){
  const n=activeNote(),pv=document.getElementById('preview');if(!pv||!n)return;
  // For preview just show the HTML content as-is (it's already HTML from contenteditable)
  pv.innerHTML=n.html||'<span style="color:var(--dimmer)">Nothing here yet.</span>';
}

// ── TREE HELPERS ──────────────────────────────────────────────────────────────
function makeNode(name){return{id:uid(),name:name.trim(),done:false,open:true,children:[],section:''};}
function findNode(nodes,id){for(const n of nodes){if(n.id===id)return n;const f=findNode(n.children,id);if(f)return f;}return null;}
function findParent(nodes,id,par=null){for(const n of nodes){if(n.id===id)return par;const f=findParent(n.children,id,n);if(f!==undefined)return f;}return undefined;}
function removeNode(nodes,id){const i=nodes.findIndex(n=>n.id===id);if(i>=0){nodes.splice(i,1);return true;}for(const n of nodes){if(removeNode(n.children,id))return true;}return false;}
function setCheckedAll(node,val){node.done=val;node.children.forEach(c=>setCheckedAll(c,val));}
function syncParents(nodes){nodes.forEach(n=>{if(n.children.length){syncParents(n.children);n.done=n.children.every(c=>c.done);n._indet=!n.done&&n.children.some(c=>c.done||c._indet);}else n._indet=false;});}
function countAll(nodes){let t=0,d=0;nodes.forEach(n=>{t++;if(n.done)d++;const s=countAll(n.children);t+=s.t;d+=s.d;});return{t,d};}

// Sections
function addSection(listId){
  const name=document.getElementById('sec-inp-'+listId)?.value.trim();
  if(!name)return;
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  if(!l.sections.includes(name))l.sections.push(name);
  sched();renderLists();
}
function removeSection(listId,sec){
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  l.sections=l.sections.filter(s=>s!==sec);
  // Clear section from items that used it
  function clear(nodes){nodes.forEach(n=>{if(n.section===sec)n.section='';clear(n.children);});}
  clear(l.items);sched();renderLists();
}
function setNodeSection(listId,nodeId,sec){
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  const n=findNode(l.items,nodeId);if(n){n.section=sec;sched();renderLists();}
}

// ── NODE CRUD ─────────────────────────────────────────────────────────────────
function startAdd(listId,parentId){addingTo={listId,parentId:parentId||null};renderLists();setTimeout(()=>{const el=document.getElementById('add-inp');if(el)el.focus();},30);}
function submitAdd(){
  const inp=document.getElementById('add-inp');if(!inp||!inp.value.trim()){cancelAdd();return;}
  const l=S.lists.find(x=>x.id===addingTo.listId);if(!l){cancelAdd();return;}
  const node=makeNode(inp.value);
  if(!addingTo.parentId)l.items.push(node);
  else{const p=findNode(l.items,addingTo.parentId);if(p){p.children.push(node);p.open=true;}}
  addingTo=null;sched();renderLists();
}
function cancelAdd(){addingTo=null;renderLists();}
function startEdit(nodeId){editingNode=nodeId;renderLists();setTimeout(()=>{const el=document.getElementById('edit-inp-'+nodeId);if(el){el.focus();el.select();}},20);}
function submitEdit(listId,nodeId){
  const inp=document.getElementById('edit-inp-'+nodeId),l=S.lists.find(x=>x.id===listId);
  if(l&&inp){const n=findNode(l.items,nodeId);if(n&&inp.value.trim())n.name=inp.value.trim();}
  editingNode=null;sched();renderLists();
}
function cancelEdit(){editingNode=null;renderLists();}
function deleteNode(listId,nodeId){const l=S.lists.find(x=>x.id===listId);if(!l)return;removeNode(l.items,nodeId);sched();renderLists();}
function toggleNodeOpen(listId,nodeId){const l=S.lists.find(x=>x.id===listId);if(!l)return;const n=findNode(l.items,nodeId);if(n){n.open=!n.open;persist();renderLists();}}
function toggleDone(listId,nodeId){
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  const n=findNode(l.items,nodeId);if(!n)return;
  setCheckedAll(n,!n.done);syncParents(l.items);sched();renderLists();
}
function indentNode(listId,nodeId){
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  const par=findParent(l.items,nodeId),sibs=par?par.children:l.items;
  const i=sibs.findIndex(n=>n.id===nodeId);if(i<1)return;
  const [node]=sibs.splice(i,1);sibs[i-1].children.push(node);sibs[i-1].open=true;
  sched();renderLists();
}
function outdentNode(listId,nodeId){
  const l=S.lists.find(x=>x.id===listId);if(!l)return;
  const par=findParent(l.items,nodeId);if(!par)return;
  const gpar=findParent(l.items,par.id),gsibs=gpar?gpar.children:l.items;
  const i=par.children.findIndex(n=>n.id===nodeId);const[node]=par.children.splice(i,1);
  const pi=gsibs.findIndex(n=>n.id===par.id);gsibs.splice(pi+1,0,node);
  sched();renderLists();
}

    const container=document.getElementById(cid);if(!container)return;
    if(cid==='mobile-panel-inner'&&mobileTab_!=='lists')return;

    let html='<div class="panel-hdr"><h3>My Lists</h3><button class="add-btn" id="nl-btn-'+cid+'">+</button></div>';

    if(listForm?.mode==='new-list'){
      html+='<div class="name-row"><input id="lf-new" type="text" placeholder="List name…" maxlength="60"><button class="ok" id="lf-new-ok">Create</button><button class="cancel" id="lf-cancel">✕</button></div>';
    }

    if(!S.lists.length){
      html+='<div style="font-size:12px;color:var(--dimmer);padding:6px 0">No lists yet — hit + to create one.</div>';
    } else {
      S.lists.forEach(lst=>{
        if(!lst.sections)lst.sections=[];
        syncParents(lst.items);
        const{t,d}=countAll(lst.items);
        const renaming=listForm?.mode==='rename-list'&&listForm?.id===lst.id;
        const curTab=activeListTab[lst.id]||'items';
        const curSec=activeSec[lst.id]||'';

        html+='<div class="lcard'+(lst.open?' open':'')+'">'+
          '<div class="lcard-hdr" data-toglist="'+lst.id+'">'+
            '<span class="lcard-tog">'+(lst.open?'▾':'▸')+'</span>'+
            (renaming
              ?'<div style="flex:1;display:flex;gap:4px;" onclick="event.stopPropagation()"><input id="lf-ren-'+lst.id+'" type="text" value="'+esc(lst.name)+'" maxlength="60" style="flex:1;background:var(--surface3);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:12px;padding:2px 6px;outline:none;"><button class="ok" style="padding:2px 6px;font-size:11px;" data-ren-ok="'+lst.id+'">✓</button></div>'
              :'<span class="lcard-name">'+esc(lst.name)+'</span>')+
            '<span class="lcard-stat">'+d+'/'+t+'</span>'+
            '<div class="lcard-acts" onclick="event.stopPropagation()">'+
              '<button class="lc-btn" data-ren-list="'+lst.id+'">✎</button>'+
              '<button class="lc-btn" data-add-top="'+lst.id+'">+</button>'+
              '<button class="lc-btn del" data-del-list="'+lst.id+'">×</button>'+
            '</div>'+
          '</div>'+
          '<div class="lcard-body">'+
            // Inner tabs
            '<div class="list-tabs">'+
              '<button class="list-tab'+(curTab==='items'?' active':'')+'" data-list-tab="'+lst.id+'|items">Items</button>'+
              '<button class="list-tab'+(curTab==='notes'?' active':'')+'" data-list-tab="'+lst.id+'|notes">Notes</button>'+
              '<button class="list-tab'+(curTab==='sections'?' active':'')+'" data-list-tab="'+lst.id+'|sections">Sections</button>'+
            '</div>'+
            // ITEMS TAB
            (curTab==='items'?
              // Section filter
              (lst.sections.length?
                '<div class="section-filter">'+
                  '<button class="sec-chip'+(curSec===''?' active':'')+'" data-sec-filter="'+lst.id+'|">All</button>'+
                  lst.sections.map(s=>'<button class="sec-chip'+(curSec===s?' active':'')+'" data-sec-filter="'+lst.id+'|'+esc(s)+'">'+esc(s)+'</button>').join('')+
                '</div>':'')+
              '<div class="tree-hint">Tab=indent · Shift+Tab=outdent · dbl-click=edit</div>'+
              renderTree(lst.items,lst.id,curSec)+
              (addingTo?.listId===lst.id&&!addingTo.parentId?renderAddForm(false):'<button class="add-top-btn" data-add-top="'+lst.id+'">+ Add item</button>')
            :'')+
            // NOTES TAB
            (curTab==='notes'?renderLinkedNotes(lst.id):'') +
            // SECTIONS TAB
            (curTab==='sections'?
              '<div style="margin-bottom:8px;font-size:11px;color:var(--dimmer)">Add named sections to filter items by category.</div>'+
              lst.sections.map(s=>'<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">'+
                '<span style="flex:1;font-size:12px;">'+esc(s)+'</span>'+
                '<button class="lc-btn del" data-del-sec="'+lst.id+'|'+esc(s)+'">×</button></div>'
              ).join('')+
              '<div style="display:flex;gap:5px;margin-top:6px;">'+

    }

function renderLinkedNotes(listId){
  const tagged=S.notes.filter(n=>(n.tags||[]).includes(listId));
  if(!tagged.length)return'<div style="font-size:11px;color:var(--dimmer);padding:6px 0">No notes tagged to this list.<br>Open a note and use the tag picker to link it here.</div>';
  return tagged.map(n=>'<div class="linked-note-item" data-jump-note="'+n.id+'">'+
    '<div class="linked-note-name">'+esc(n.name)+'</div>'+
    '<div class="linked-note-preview">'+(n.html?n.html.replace(/<[^>]+>/g,'').slice(0,80):'')+'</div>'+
  '</div>').join('');
}

function renderAddForm(isChild){
  const cls='add-row'+(isChild?' child':'');
  return'<div class="'+cls+'"><input id="add-inp" type="text" placeholder="Item name…" maxlength="200"><button class="ok" id="add-ok">+</button><button class="cancel" id="add-cancel">✕</button></div>';
}

function renderTree(nodes,listId,secFilter){
  if(!nodes.length)return'';
  let html='';
  nodes.forEach(node=>{
    // Filter by section at top level only
    if(secFilter&&!node.section&&secFilter){}// show unassigned too? No, hide them.
    const visible=!secFilter||(node.section===secFilter)||hasDescendantInSec(node,secFilter);
    if(!visible)return;
    const hasKids=node.children.length>0;
    const isEditing=editingNode===node.id;
    const addingUnder=addingTo?.listId===listId&&addingTo?.parentId===node.id;
    const secLabel=node.section?'<span class="tnode-sec">['+esc(node.section)+']</span>':'';

    html+='<div class="tnode">'+
      '<div class="tnode-row">'+
        '<span class="tnode-tog'+(hasKids?'"data-tog="'+listId+'|'+node.id+'"':' " style="cursor:default;color:transparent"')+'>'+
          (hasKids?(node.open?'▾':'▸'):'·')+'</span>'+
        '<input type="checkbox" class="tnode-cb" '+(node.done?'checked':'')+' data-cb="'+listId+'|'+node.id+'">'+
        (isEditing
          ?'<input id="edit-inp-'+node.id+'" class="tnode-inp" type="text" value="'+esc(node.name)+'" maxlength="200" data-edit-inp="'+listId+'|'+node.id+'">'
          :'<span class="tnode-lbl'+(node.done?' done':'')+'" data-edit-lbl="'+node.id+'">'+esc(node.name)+'</span>'+secLabel)+
        '<div class="tnode-acts">'+
          (S.lists.find(l=>l.items&&findNode(l.items,node.id))?.sections?.length?
            '<select class="ta-btn" data-sec-sel="'+listId+'|'+node.id+'" style="font-size:10px;background:var(--surface3);border:1px solid var(--border);border-radius:2px;color:var(--text);padding:0 2px;"><option value="">—</option>'+
            (S.lists.find(l=>l.id===listId)?.sections||[]).map(s=>'<option value="'+esc(s)+'"'+(node.section===s?' selected':'')+'>'+esc(s)+'</option>').join('')+
            '</select>':'')+
          '<button class="ta-btn" data-add-child="'+listId+'|'+node.id+'">+</button>'+
          '<button class="ta-btn" data-indent="'+listId+'|'+node.id+'">→</button>'+
          '<button class="ta-btn" data-outdent="'+listId+'|'+node.id+'">←</button>'+
          '<button class="ta-btn" data-edit-btn="'+node.id+'">✎</button>'+
          '<button class="ta-btn del" data-del-node="'+listId+'|'+node.id+'">×</button>'+
        '</div>'+
      '</div>'+
      (addingUnder?renderAddForm(true):'')+
      (hasKids?'<div class="tnode-children" style="'+(node.open?'display:block':'display:none')+'">'+renderTree(node.children,listId,'')+'</div>':'')+
    '</div>';
  });
  return html;
}

function hasDescendantInSec(node,sec){
  if(node.section===sec)return true;
  return node.children.some(c=>hasDescendantInSec(c,sec));
}

function bindListEvents(container){
  // New list
  container.querySelector('[id^="nl-btn-"]')?.addEventListener('click',startNewList);
  document.getElementById('lf-new-ok')?.addEventListener('click',submitNewList);
  document.getElementById('lf-cancel')?.addEventListener('click',cancelNewList);
  const lfn=document.getElementById('lf-new');
  if(lfn)lfn.addEventListener('keydown',e=>{if(e.key==='Enter')submitNewList();if(e.key==='Escape')cancelNewList();e.stopPropagation();});

  // List header toggles
  container.querySelectorAll('[data-toglist]').forEach(el=>el.addEventListener('click',()=>toggleList(el.dataset.toglist)));
  container.querySelectorAll('[data-ren-list]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();startRenameList(b.dataset.renList);}));
  container.querySelectorAll('[data-ren-ok]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();submitRenameList(b.dataset.renOk);}));
  S.lists.forEach(lst=>{
    const ri=document.getElementById('lf-ren-'+lst.id);
    if(ri)ri.addEventListener('keydown',e=>{if(e.key==='Enter')submitRenameList(lst.id);if(e.key==='Escape'){listForm=null;renderLists();}e.stopPropagation();});
  });
  container.querySelectorAll('[data-del-list]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();deleteList(b.dataset.delList);}));
  container.querySelectorAll('[data-add-top]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();startAdd(b.dataset.addTop,null);}));

  // Inner tabs
  container.querySelectorAll('[data-list-tab]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const[lid,tab]=b.dataset.listTab.split('|');activeListTab[lid]=tab;renderLists();
  }));

  // Section filter
  container.querySelectorAll('[data-sec-filter]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const[lid,sec]=b.dataset.secFilter.split('|');activeSec[lid]=sec;renderLists();
  }));

  // Add section
  container.querySelectorAll('[data-add-sec]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();addSection(b.dataset.addSec);}));
  S.lists.forEach(lst=>{
    const si=document.getElementById('sec-inp-'+lst.id);
    if(si)si.addEventListener('keydown',e=>{if(e.key==='Enter')addSection(lst.id);e.stopPropagation();});
  });
  container.querySelectorAll('[data-del-sec]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const[lid,sec]=b.dataset.delSec.split('|');removeSection(lid,sec);
  }));

  // Add form
  const addInp=document.getElementById('add-inp');
  if(addInp){
    addInp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAdd();if(e.key==='Escape')cancelAdd();e.stopPropagation();});
    document.getElementById('add-ok')?.addEventListener('click',submitAdd);
    document.getElementById('add-cancel')?.addEventListener('click',cancelAdd);
  }

  // Node events
  container.querySelectorAll('[data-tog]').forEach(el=>{
    const[lid,nid]=el.dataset.tog.split('|');
    el.addEventListener('click',e=>{e.stopPropagation();toggleNodeOpen(lid,nid);});
  });
  container.querySelectorAll('[data-cb]').forEach(cb=>{
    const[lid,nid]=cb.dataset.cb.split('|');
    cb.addEventListener('change',()=>toggleDone(lid,nid));
  });
  container.querySelectorAll('[data-edit-lbl]').forEach(el=>{
    el.addEventListener('dblclick',e=>{e.stopPropagation();startEdit(el.dataset.editLbl);});
  });
  container.querySelectorAll('[data-edit-inp]').forEach(inp=>{
    const[lid,nid]=inp.dataset.editInp.split('|');
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter')submitEdit(lid,nid);
      if(e.key==='Escape')cancelEdit();
      if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();indentNode(lid,nid);}
      if(e.key==='Tab'&&e.shiftKey){e.preventDefault();outdentNode(lid,nid);}
      e.stopPropagation();
    });
    inp.addEventListener('blur',()=>submitEdit(lid,nid));
  });
  container.querySelectorAll('[data-add-child]').forEach(b=>{
    const[lid,nid]=b.dataset.addChild.split('|');
    b.addEventListener('click',e=>{e.stopPropagation();startAdd(lid,nid);});
  });
  container.querySelectorAll('[data-indent]').forEach(b=>{
    const[lid,nid]=b.dataset.indent.split('|');
    b.addEventListener('click',e=>{e.stopPropagation();indentNode(lid,nid);});
  });
  container.querySelectorAll('[data-outdent]').forEach(b=>{
    const[lid,nid]=b.dataset.outdent.split('|');
    b.addEventListener('click',e=>{e.stopPropagation();outdentNode(lid,nid);});
  });
  container.querySelectorAll('[data-edit-btn]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();startEdit(b.dataset.editBtn);});
  });
  container.querySelectorAll('[data-del-node]').forEach(b=>{
    const[lid,nid]=b.dataset.delNode.split('|');
    b.addEventListener('click',e=>{e.stopPropagation();deleteNode(lid,nid);});
  });
  container.querySelectorAll('[data-sec-sel]').forEach(sel=>{
    const[lid,nid]=sel.dataset.secSel.split('|');
    sel.addEventListener('change',e=>{e.stopPropagation();setNodeSection(lid,nid,sel.value);});
  });
  // Jump to linked note
  container.querySelectorAll('[data-jump-note]').forEach(el=>{
    el.addEventListener('click',()=>{switchNote(el.dataset.jumpNote);showSideTab('notes');});
  });
}

// ── SIDEBAR / MOBILE TABS ─────────────────────────────────────────────────────
function showSideTab(t){
  sideTab=t;
  document.getElementById('side-lists').style.display=t==='lists'?'block':'none';
  document.getElementById('side-notes-panel').style.display=t==='notes'?'block':'none';
  document.getElementById('stab-lists').classList.toggle('active',t==='lists');
  document.getElementById('stab-notes').classList.toggle('active',t==='notes');
  if(t==='notes')renderSideNotes();
}
function switchMobileTab(tab){
  mobileTab_=tab;
  document.getElementById('mnav-lists').classList.toggle('active',tab==='lists');
  document.getElementById('mnav-notes').classList.toggle('active',tab==='notes');
  const mp=document.getElementById('mobile-panel'),mn=document.getElementById('main');
  if(tab==='notes'){mp.style.display='none';mn.style.display='flex';}
  else{mp.style.display='flex';mn.style.display='none';renderLists();}
}

// ── BIND EVENTS ───────────────────────────────────────────────────────────────
function bindEvents(){
  document.getElementById('btn-new').addEventListener('click',()=>newNote());
  document.getElementById('btn-dbx-save').addEventListener('click',dbxSave);
  document.getElementById('btn-dbx-load').addEventListener('click',dbxLoad);
  document.getElementById('btn-backup').addEventListener('click',backup);
  document.getElementById('btn-restore').addEventListener('click',()=>document.getElementById('file-in').click());
  document.getElementById('file-in').addEventListener('change',restore);
  document.getElementById('btn-dl').addEventListener('click',()=>{
    const n=activeNote();if(!n)return;
    const text=(document.getElementById('editor-area').innerText||'');
    const b=new Blob([text],{type:'text/plain'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=(n.name||'note').replace(/[^a-z0-9_-]/gi,'_')+'.txt';a.click();URL.revokeObjectURL(a.href);
  });
  document.getElementById('btn-edit').addEventListener('click',()=>setMode('edit'));
  document.getElementById('btn-prev').addEventListener('click',()=>setMode('preview'));
  document.getElementById('stab-lists').addEventListener('click',()=>showSideTab('lists'));
  document.getElementById('stab-notes').addEventListener('click',()=>showSideTab('notes'));
  document.getElementById('mnav-lists').addEventListener('click',()=>switchMobileTab('lists'));
  document.getElementById('mnav-notes').addEventListener('click',()=>switchMobileTab('notes'));
  document.getElementById('tag-add-btn').addEventListener('click',e=>{e.stopPropagation();openTagPicker();});

  // Image button
  document.getElementById('btn-img').addEventListener('click',()=>document.getElementById('img-in').click());
  document.getElementById('img-in').addEventListener('change',e=>{const f=e.target.files[0];if(f)insertImageFile(f);e.target.value='';});

  // Editor
  const ea=document.getElementById('editor-area');
  ea.addEventListener('input',e=>{saveEditorToNote();updateCounts(ea.innerText||'');sched();});
  ea.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();dbxSave();}
  });
  // Drag & drop images
  ea.addEventListener('dragover',e=>{e.preventDefault();ea.classList.add('dragover');});
  ea.addEventListener('dragleave',()=>ea.classList.remove('dragover'));
  ea.addEventListener('drop',e=>{
    e.preventDefault();ea.classList.remove('dragover');
    const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
    if(files.length)insertImageFile(files[0]);
  });
  // Paste images
  ea.addEventListener('paste',e=>{
    const items=Array.from(e.clipboardData.items||[]);
    const imgItem=items.find(i=>i.type.startsWith('image/'));
    if(imgItem){e.preventDefault();insertImageFile(imgItem.getAsFile());}
  });

  // Close tag picker on outside click
  document.addEventListener('click',e=>{
    const picker=document.getElementById('tag-picker');
    if(tagPickerOpen&&!picker.contains(e.target)&&e.target.id!=='tag-add-btn'){
      picker.classList.remove('show');tagPickerOpen=false;
    }
  });

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();dbxSave();}
    if((e.ctrlKey||e.metaKey)&&e.key==='n'&&document.activeElement.id!=='editor-area'){e.preventDefault();newNote();}
  });
}

init();
</script>
