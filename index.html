<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1a1a;--surface:#242424;--surface2:#2e2e2e;--surface3:#383838;
  --border:#383838;--text:#e8e8e8;--dim:#888;--dimmer:#555;
  --accent:#c8952a;--accent2:#7a5a19;--danger:#8b3030;--danger-h:#a83a3a;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Courier New',monospace;
  --sidebar-w:300px;--sidebar-min:180px;--sidebar-max:600px;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
#shell{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-min);max-width:var(--sidebar-max);flex-shrink:0;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative;}
#sidebar-tabs{display:flex;border-bottom:1px solid var(--border);}
.stab{flex:1;padding:11px 6px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;color:var(--dim);border:none;background:none;letter-spacing:.5px;text-transform:uppercase;transition:all .15s;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--accent);border-bottom:2px solid var(--accent);}
#sidebar-body{flex:1;overflow-y:auto;padding:10px 12px 14px;}
#sidebar-body::-webkit-scrollbar{width:4px;}
#sidebar-body::-webkit-scrollbar-thumb{background:var(--border);}

/* DRAG HANDLE */
#drag-handle{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;background:transparent;z-index:10;transition:background .15s;}
#drag-handle:hover,#drag-handle.dragging{background:var(--accent);}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;border-left:1px solid var(--border);}

/* TOPBAR */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
#app-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);flex-shrink:0;}
#search-wrap{flex:1;position:relative;max-width:280px;}
#search-wrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim);}
#search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;padding:5px 8px 5px 28px;outline:none;}
#search:focus{border-color:var(--accent);}
#search::placeholder{color:var(--dimmer);}
#btn-new{margin-left:auto;background:var(--accent);color:#111;border:none;border-radius:4px;font-size:12px;font-weight:700;padding:5px 14px;cursor:pointer;flex-shrink:0;}

/* SAVEBAR */
#savebar{display:flex;align-items:center;gap:6px;padding:5px 12px;background:#1e1e1e;border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0;flex-wrap:wrap;}
#save-status{flex:1;min-width:100px;font-size:11px;}
.save-btn{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:3px 10px;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.save-btn:hover{border-color:var(--accent);color:var(--accent);}
.save-btn.primary{border-color:var(--accent);color:var(--accent);}

/* SEARCH RESULTS */
#search-results{position:absolute;top:40px;left:0;width:320px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:100;display:none;overflow:hidden;}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.sr-item:hover{background:var(--surface);}
.sr-name{font-size:12px;font-weight:700;}
.sr-snippet{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-hl{color:var(--accent);font-weight:700;}
.sr-empty{padding:12px 14px;font-size:12px;color:var(--dim);}

/* NOTE TABS */
#tabs-row{display:flex;align-items:stretch;background:#1e1e1e;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin;}
#tabs-row::-webkit-scrollbar{height:4px;}
#tabs-row::-webkit-scrollbar-thumb{background:var(--border);}
.tab{display:flex;align-items:center;cursor:pointer;border-right:1px solid var(--border);color:var(--dim);background:#1e1e1e;max-width:200px;min-width:80px;transition:background .1s,color .1s;}
.tab:hover{background:var(--surface2);color:var(--text);}
.tab.active{background:var(--surface2);color:var(--text);border-bottom:2px solid var(--accent);}
.tab-label{flex:1;padding:8px 8px 8px 12px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;}
.tab-input{display:none;flex:1;background:var(--surface3);border:none;outline:none;color:var(--text);font-size:12px;padding:8px 4px 8px 10px;font-family:var(--font);min-width:0;}
.tab.renaming .tab-label{display:none;}
.tab.renaming .tab-input{display:block;}
.tab-close{padding:8px 8px 8px 2px;font-size:14px;color:var(--dimmer);}
.tab-close:hover{color:#ff6060;}

/* NOTE META */
#note-meta{padding:6px 16px;font-size:11px;color:var(--dimmer);border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.meta-left{display:flex;gap:16px;}
#btn-download{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:2px 10px;border-radius:3px;cursor:pointer;}
#btn-download:hover{border-color:var(--accent);color:var(--accent);}

/* EDITOR */
#editor-wrap{flex:1;display:flex;overflow:hidden;}
#editor{flex:1;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;font-family:var(--mono);font-size:14px;line-height:1.7;padding:20px 24px;}
#editor::placeholder{color:var(--dimmer);}
#preview{flex:1;overflow-y:auto;padding:20px 24px;font-size:14px;line-height:1.7;display:none;color:var(--text);}
#preview h1{font-size:22px;margin:0 0 12px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
#preview h2{font-size:18px;margin:16px 0 8px;color:var(--accent);}
#preview h3{font-size:15px;margin:14px 0 6px;color:#ccc;}
#preview p{margin:0 0 10px;}
#preview strong{color:#fff;}
#preview em{color:#bbb;}
#preview code{background:var(--surface2);padding:2px 6px;border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--accent);}
#preview pre{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:12px;margin:10px 0;overflow-x:auto;}
#preview pre code{background:none;padding:0;color:var(--text);}
#preview ul,#preview ol{margin:0 0 10px 20px;}
#preview li{margin-bottom:4px;}
#preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--dim);margin:10px 0;}
#preview hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
#preview a{color:var(--accent);}

/* STATUSBAR */
#statusbar{display:flex;align-items:center;padding:4px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--dimmer);flex-shrink:0;}
#mode-toggle{display:flex;gap:2px;background:var(--surface2);border-radius:4px;padding:2px;margin-left:auto;}
.mode-btn{background:none;border:none;color:var(--dim);font-size:11px;padding:3px 10px;border-radius:3px;cursor:pointer;}
.mode-btn.active{background:var(--accent);color:#111;font-weight:700;}

/* LIST PANEL HEADER */
.lb-section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;}
.lb-section-header h3{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
.lb-new-btn{background:var(--accent);color:#111;border:none;border-radius:4px;font-size:18px;font-weight:700;width:24px;height:24px;cursor:pointer;line-height:1;flex-shrink:0;}
.inline-name-row{display:flex;gap:6px;margin-bottom:10px;}
.inline-name-row input{flex:1;background:var(--surface2);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-size:12px;padding:5px 8px;outline:none;min-width:0;}
.inline-name-row button{background:var(--accent);color:#111;border:none;border-radius:4px;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;}
.inline-name-row .cancel-btn{background:none;border:1px solid var(--border);color:var(--dim);}

/* LIST CARDS */
.lcard{border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden;}
.lcard-header{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--surface2);cursor:pointer;user-select:none;}
.lcard-toggle{font-size:10px;color:var(--dim);flex-shrink:0;width:14px;}
.lcard-name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lcard-count{font-size:10px;color:var(--dim);flex-shrink:0;}
.lcard-actions{display:flex;gap:2px;flex-shrink:0;}
.lcard-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;line-height:1;}
.lcard-btn:hover{background:var(--surface3);color:var(--text);}
.lcard-btn.del:hover{background:var(--danger);color:#fff;}
.lcard-body{padding:6px 8px 8px;background:var(--bg);display:none;}
.lcard.open .lcard-body{display:block;}

/* OUTLINE / NESTED ITEMS */
.outline-add-row{display:flex;gap:6px;margin-bottom:6px;}
.outline-add-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;padding:4px 8px;outline:none;min-width:0;}
.outline-add-row input:focus{border-color:var(--accent);}
.outline-add-row input::placeholder{color:var(--dimmer);}
.outline-add-row button{background:var(--accent);color:#111;border:none;border-radius:4px;font-size:14px;font-weight:700;width:26px;cursor:pointer;flex-shrink:0;}

.outline-hint{font-size:10px;color:var(--dimmer);margin-bottom:8px;line-height:1.4;}

/* TREE NODES */
.tree-node{position:relative;}
.tree-children{display:none;border-left:1px solid var(--border);margin-left:16px;}
.tree-node.open>.tree-children{display:block;}

.node-row{display:flex;align-items:center;gap:4px;padding:3px 2px;border-radius:4px;min-height:26px;}
.node-row:hover{background:var(--surface2);}
.node-row:hover .node-actions{opacity:1;}

.node-toggle{width:14px;height:14px;flex-shrink:0;font-size:10px;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px;}
.node-toggle:hover{background:var(--surface3);}
.node-toggle.leaf{cursor:default;color:transparent;}

.node-cb{accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;cursor:pointer;}
.node-cb.indeterminate{opacity:.6;}

.node-label{flex:1;font-size:12px;line-height:1.4;word-break:break-word;cursor:text;min-width:0;}
.node-label.done{text-decoration:line-through;color:var(--dim);}

.node-input{flex:1;background:var(--surface3);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:12px;padding:2px 6px;outline:none;min-width:0;font-family:var(--font);}

.node-actions{opacity:0;display:flex;gap:2px;flex-shrink:0;transition:opacity .1s;}
.node-action-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:11px;padding:1px 4px;border-radius:2px;line-height:1;}
.node-action-btn:hover{background:var(--surface3);color:var(--text);}
.node-action-btn.del:hover{background:var(--danger);color:#fff;}

.node-add-row{display:flex;gap:4px;margin:2px 0 2px 18px;}
.node-add-row input{flex:1;background:var(--surface2);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:11px;padding:3px 6px;outline:none;min-width:0;}
.node-add-row button{background:var(--accent);color:#111;border:none;border-radius:3px;font-size:12px;font-weight:700;width:22px;cursor:pointer;flex-shrink:0;}
.node-add-row .cancel-btn{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;width:22px;}

/* MOBILE */
#mobile-nav{display:none;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);}
.mnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;background:none;border:none;color:var(--dim);font-size:10px;cursor:pointer;}
.mnav-btn.active{color:var(--accent);}
#mobile-panel{display:none;flex:1;overflow:hidden;flex-direction:column;}
#mobile-panel-inner{flex:1;overflow-y:auto;padding:0 12px 14px;}

@media(max-width:700px){
  #sidebar,#main{display:none;}
  #mobile-nav{display:flex;}
  #mobile-panel{display:flex;}
  body{flex-direction:column;}
  #shell{flex:1;overflow:hidden;display:flex;flex-direction:column;}
}
@media(min-width:701px){
  #mobile-nav,#mobile-panel{display:none;}
  #main,#sidebar{display:flex;}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar">
    <div id="drag-handle" id="dh"></div>
    <div id="sidebar-tabs">
      <button class="stab active" id="stab-lists" onclick="showSideTab('lists')">Lists</button>
      <button class="stab" id="stab-notes" onclick="showSideTab('notes')">Notes</button>
    </div>
    <div id="sidebar-body">
      <div id="side-lists"></div>
      <div id="side-notes-panel" style="display:none"></div>
    </div>
    <div id="drag-handle" style="position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;" id="real-drag"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="app-title">Notepad</div>
      <div id="search-wrap">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="text" placeholder="Search notes…" autocomplete="off">
        <div id="search-results"></div>
      </div>
      <button id="btn-new">+ New Note</button>
    </div>

    <div id="savebar">
      <span id="save-status">Not connected to Dropbox</span>
      <button class="save-btn primary" onclick="dropboxSave()">☁ Save</button>
      <button class="save-btn primary" onclick="dropboxLoad()">☁ Load</button>
      <button class="save-btn" onclick="exportData()">⬇ Backup</button>
      <button class="save-btn" onclick="document.getElementById('file-in').click()">⬆ Restore</button>
      <input type="file" id="file-in" accept=".json" style="display:none" onchange="importData(event)">
    </div>

    <div id="tabs-row"></div>
    <div id="note-meta">
      <div class="meta-left">
        <span id="meta-created"></span>
        <span id="meta-words">0 words</span>
        <span id="meta-chars">0 chars</span>
      </div>
      <button id="btn-download">↓ .txt</button>
    </div>
    <div id="editor-wrap">
      <textarea id="editor" placeholder="Start typing…" spellcheck="true"></textarea>
      <div id="preview"></div>
    </div>
    <div id="statusbar">
      <div id="mode-toggle">
        <button class="mode-btn active" id="btn-edit" onclick="setMode('edit')">Edit</button>
        <button class="mode-btn" id="btn-preview" onclick="setMode('preview')">Preview</button>
      </div>
    </div>
  </div>
</div>

<div id="mobile-nav">
  <button class="mnav-btn active" id="mnav-lists" onclick="mobileTab('lists')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Lists
  </button>
  <button class="mnav-btn" id="mnav-notes" onclick="mobileTab('notes')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Notes
  </button>
</div>
<div id="mobile-panel"><div id="mobile-panel-inner"></div></div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const SK='npv4';
const DBX_APP_KEY='x8otifau2aup4hr';
const DBX_PATH='/notepad-data.json';
const REDIRECT_URI=location.origin+location.pathname;

let S={notes:[],activeId:null,lists:[]};
let saveTimer=null,editorMode='edit',currentMobileTab='lists',currentSideTab='lists';
let renamingNoteId=null,listFormState=null;
let dbxToken=localStorage.getItem('npv4_dbx')||null;

// ─── INIT ─────────────────────────────────────────────────────────────────────
function load(){
  try{const r=localStorage.getItem(SK);if(r)S=JSON.parse(r);}catch(e){}
  if(!S.notes)S.notes=[];
  if(!S.lists)S.lists=[];
  if(location.hash.includes('access_token')){
    const p=new URLSearchParams(location.hash.slice(1));
    const tok=p.get('access_token');
    if(tok){dbxToken=tok;localStorage.setItem('npv4_dbx',tok);}
    history.replaceState(null,'',location.pathname);
  }
  if(S.notes.length===0)createNote(false);
  else renderNotes();
  renderLists('side');
  setStatus(dbxToken?'Dropbox connected ✓':'Not connected to Dropbox',dbxToken?'#5a9e5a':'');
  initDragHandle();
}
function saveLocal(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function sched(){clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,800);}
function genId(){return '_'+Math.random().toString(36).slice(2,11);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setStatus(msg,color=''){const el=document.getElementById('save-status');if(el){el.textContent=msg;el.style.color=color;}}

// ─── SIDEBAR DRAG ─────────────────────────────────────────────────────────────
function initDragHandle(){
  const sidebar=document.getElementById('sidebar');
  const handle=document.querySelector('#sidebar [style*="col-resize"]');
  if(!handle)return;
  handle.addEventListener('mousedown',e=>{
    e.preventDefault();
    handle.classList.add('dragging');
    const startX=e.clientX,startW=sidebar.offsetWidth;
    function onMove(e){
      const newW=Math.min(Math.max(startW+(e.clientX-startX),180),600);
      sidebar.style.width=newW+'px';
    }
    function onUp(){
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}

// ─── DROPBOX ──────────────────────────────────────────────────────────────────
function dropboxAuth(){location.href=`https://www.dropbox.com/oauth2/authorize?client_id=${DBX_APP_KEY}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;}
async function dropboxSave(){
  if(!dbxToken){dropboxAuth();return;}
  const cur=activeNote();if(cur)cur.content=document.getElementById('editor').value;
  saveLocal();setStatus('Saving…','#c8952a');
  try{
    const res=await fetch('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH,mode:'overwrite',autorename:false}),'Content-Type':'application/octet-stream'},
      body:JSON.stringify(S)
    });
    if(res.ok)setStatus('Saved ✓ '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}),'#5a9e5a');
    else if(res.status===401){dbxToken=null;localStorage.removeItem('npv4_dbx');dropboxAuth();}
    else setStatus('Save failed ('+res.status+')','#cc6060');
  }catch(e){setStatus('Error: '+e.message,'#cc6060');}
}
async function dropboxLoad(){
  if(!dbxToken){dropboxAuth();return;}
  setStatus('Loading…','#c8952a');
  try{
    const res=await fetch('https://content.dropboxapi.com/2/files/download',{
      method:'POST',
      headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH})}
    });
    if(res.ok){
      const loaded=await res.json();
      if(loaded.notes&&loaded.lists){S=loaded;saveLocal();renderNotes();renderLists('side');setStatus('Loaded ✓','#5a9e5a');}
      else setStatus('Unrecognized file format','#cc6060');
    } else if(res.status===409)setStatus('No save file yet — save first','#c8952a');
    else if(res.status===401){dbxToken=null;localStorage.removeItem('npv4_dbx');dropboxAuth();}
    else setStatus('Load failed ('+res.status+')','#cc6060');
  }catch(e){setStatus('Error: '+e.message,'#cc6060');}
}
function exportData(){
  const cur=activeNote();if(cur)cur.content=document.getElementById('editor').value;
  saveLocal();
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='notepad-data.json';a.click();URL.revokeObjectURL(a.href);
  setStatus('Backup downloaded','#5a9e5a');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      const loaded=JSON.parse(evt.target.result);
      if(loaded.notes&&loaded.lists){S=loaded;saveLocal();renderNotes();renderLists('side');setStatus('Restored ✓','#5a9e5a');}
      else setStatus('Unrecognized file','#cc6060');
    }catch{setStatus('Could not read file','#cc6060');}
  };
  reader.readAsText(file);e.target.value='';
}

// ─── NOTES ────────────────────────────────────────────────────────────────────
function createNote(focus=true){
  const note={id:genId(),name:'Untitled Note',content:'',created:new Date().toISOString()};
  S.notes.push(note);S.activeId=note.id;saveLocal();
  renamingNoteId=focus?note.id:null;renderNotes();
}
function deleteNote(id){
  if(S.notes.length===1){const n=S.notes[0];n.content='';n.name='Untitled Note';n.created=new Date().toISOString();saveLocal();renderNotes();return;}
  const idx=S.notes.findIndex(n=>n.id===id);S.notes.splice(idx,1);
  if(S.activeId===id)S.activeId=S.notes[Math.min(idx,S.notes.length-1)].id;
  saveLocal();renderNotes();
}
function activeNote(){return S.notes.find(n=>n.id===S.activeId);}
function switchNote(id){
  if(renamingNoteId)commitNoteRename(renamingNoteId);
  const cur=activeNote();if(cur)cur.content=document.getElementById('editor').value;
  S.activeId=id;saveLocal();renderNotes();
  if(editorMode==='edit')setTimeout(()=>document.getElementById('editor')?.focus(),30);
}
function startNoteRename(id){
  renamingNoteId=id;renderTabs();
  setTimeout(()=>{const i=document.querySelector(`.tab[data-id="${id}"] .tab-input`);if(i){i.focus();i.select();}},20);
}
function commitNoteRename(id){
  const note=S.notes.find(n=>n.id===id);
  const inp=document.querySelector(`.tab[data-id="${id}"] .tab-input`);
  if(note&&inp){note.name=inp.value.trim()||'Untitled Note';}
  renamingNoteId=null;sched();renderTabs();renderSideNotes();
}
function renderNotes(){renderTabs();renderEditor();renderMeta();renderSideNotes();}
function renderTabs(){
  const row=document.getElementById('tabs-row');if(!row)return;row.innerHTML='';
  S.notes.forEach(note=>{
    const tab=document.createElement('div');
    tab.className='tab'+(note.id===S.activeId?' active':'')+(note.id===renamingNoteId?' renaming':'');
    tab.dataset.id=note.id;
    const lbl=document.createElement('span');lbl.className='tab-label';lbl.textContent=note.name;
    lbl.addEventListener('dblclick',e=>{e.stopPropagation();startNoteRename(note.id);});
    lbl.addEventListener('click',()=>{if(note.id!==S.activeId)switchNote(note.id);});
    const inp=document.createElement('input');inp.className='tab-input';inp.type='text';inp.value=note.name;inp.maxLength=60;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitNoteRename(note.id);}if(e.key==='Escape'){renamingNoteId=null;renderTabs();}e.stopPropagation();});
    inp.addEventListener('blur',()=>commitNoteRename(note.id));
    inp.addEventListener('click',e=>e.stopPropagation());
    const cl=document.createElement('span');cl.className='tab-close';cl.innerHTML='×';
    cl.addEventListener('click',e=>{e.stopPropagation();deleteNote(note.id);});
    tab.appendChild(lbl);tab.appendChild(inp);tab.appendChild(cl);row.appendChild(tab);
  });
  if(renamingNoteId){const i=document.querySelector(`.tab[data-id="${renamingNoteId}"] .tab-input`);if(i){i.focus();i.select();}}
}
function renderEditor(){
  const note=activeNote();const ed=document.getElementById('editor');if(!ed||!note)return;
  ed.value=note.content;updateCounts(note.content);
  if(editorMode==='preview')renderMD(note.content);
}
function renderMeta(){
  const note=activeNote();if(!note)return;
  const d=new Date(note.created);
  const el=document.getElementById('meta-created');if(!el)return;
  el.textContent='Created '+d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function updateCounts(t){
  const w=t.trim()?t.trim().split(/\s+/).length:0;
  document.getElementById('meta-words').textContent=w+' word'+(w!==1?'s':'');
  document.getElementById('meta-chars').textContent=t.length+' char'+(t.length!==1?'s':'');
}
function renderSideNotes(){
  const el=document.getElementById('side-notes-panel');if(!el)return;
  el.innerHTML=`<div class="lb-section-header"><h3>All Notes</h3><button class="lb-new-btn" onclick="createNote()">+</button></div>`+
  S.notes.map(n=>`<div class="lcard${n.id===S.activeId?' open':''}" onclick="switchNote('${n.id}');showSideTab('notes')">
    <div class="lcard-header"><span class="lcard-name">${esc(n.name)}</span>
    <span class="lcard-count">${n.content.trim()?n.content.trim().split(/\s+/).length+' w':''}</span>
    <div class="lcard-actions"><button class="lcard-btn del" onclick="event.stopPropagation();deleteNote('${n.id}')">×</button></div></div>
  </div>`).join('');
}
document.getElementById('editor').addEventListener('input',e=>{
  const note=activeNote();if(!note)return;note.content=e.target.value;updateCounts(e.target.value);sched();
});
function setMode(m){
  editorMode=m;const ed=document.getElementById('editor'),pv=document.getElementById('preview');
  document.getElementById('btn-edit').classList.toggle('active',m==='edit');
  document.getElementById('btn-preview').classList.toggle('active',m==='preview');
  if(m==='edit'){ed.style.display='block';pv.style.display='none';ed.focus();}
  else{const n=activeNote();renderMD(n?n.content:'');ed.style.display='none';pv.style.display='block';}
}
function renderMD(md){
  const pv=document.getElementById('preview');if(!pv)return;
  let h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^---$/gm,'<hr>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
  h=h.replace(/(<li>.*?<\/li>(\s*<br>)*)+/g,m=>'<ul>'+m.replace(/<br>/g,'')+'</ul>');
  pv.innerHTML='<p>'+h+'</p>';
}
const srch=document.getElementById('search'),srchR=document.getElementById('search-results');
srch.addEventListener('input',()=>{
  const q=srch.value.trim().toLowerCase();if(!q){srchR.style.display='none';return;}
  const m=S.notes.filter(n=>n.name.toLowerCase().includes(q)||n.content.toLowerCase().includes(q));
  if(!m.length)srchR.innerHTML='<div class="sr-empty">No results.</div>';
  else srchR.innerHTML=m.map(n=>{
    const ci=n.content.toLowerCase().indexOf(q);let snip='';
    if(ci>=0){const s=Math.max(0,ci-20);snip=n.content.substring(s,ci+q.length+40).replace(new RegExp(q,'gi'),m=>`<span class="sr-hl">${m}</span>`);if(s>0)snip='…'+snip;}
    return`<div class="sr-item" onclick="switchNote('${n.id}');closeSrch()"><div class="sr-name">${n.name.replace(new RegExp(q,'gi'),m=>`<span class="sr-hl">${m}</span>`)}</div>${snip?`<div class="sr-snippet">${snip}</div>`:''}</div>`;
  }).join('');
  srchR.style.display='block';
});
function closeSrch(){srch.value='';srchR.style.display='none';}
document.addEventListener('click',e=>{if(!document.getElementById('search-wrap').contains(e.target))srchR.style.display='none';});
srch.addEventListener('keydown',e=>{if(e.key==='Escape')closeSrch();});
function downloadNote(){
  const n=activeNote();if(!n)return;
  const b=new Blob([n.content],{type:'text/plain'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=(n.name||'note').replace(/[^a-z0-9_\-]/gi,'_')+'.txt';a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('btn-download').addEventListener('click',downloadNote);
document.getElementById('btn-new').addEventListener('click',()=>createNote());
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();dropboxSave();}
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();createNote();}
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();srch.focus();srch.select();}
});

// ─── NESTED LIST ENGINE ───────────────────────────────────────────────────────
// Node: {id, name, done, open, children:[...nodes]}

function makeNode(name){return{id:genId(),name:name.trim(),done:false,open:true,children:[]};}

function findNode(nodes,id){
  for(const n of nodes){
    if(n.id===id)return n;
    const f=findNode(n.children,id);if(f)return f;
  }return null;
}
function findParent(nodes,id,parent=null){
  for(const n of nodes){
    if(n.id===id)return parent;
    const f=findParent(n.children,id,n);if(f!==undefined)return f;
  }return undefined;
}
function removeNode(nodes,id){
  const idx=nodes.findIndex(n=>n.id===id);
  if(idx>=0){nodes.splice(idx,1);return true;}
  for(const n of nodes){if(removeNode(n.children,id))return true;}
  return false;
}

// Cascade check down
function setChecked(node,val){
  node.done=val;
  node.children.forEach(c=>setChecked(c,val));
}
// Update parent check state based on children
function syncParents(lists){
  S.lists.forEach(lst=>syncNodeParents(lst.items));
}
function syncNodeParents(nodes){
  nodes.forEach(n=>{
    if(n.children.length){
      syncNodeParents(n.children);
      const allDone=n.children.every(c=>c.done);
      const noneDone=n.children.every(c=>!c.done);
      n.done=allDone;
      n._indeterminate=!allDone&&!noneDone;
    }
  });
}

// Count stats
function countNodes(nodes){
  let total=0,done=0;
  nodes.forEach(n=>{total++;if(n.done)done++;const s=countNodes(n.children);total+=s.total;done+=s.done;});
  return{total,done};
}

// ─── LIST CRUD ────────────────────────────────────────────────────────────────
function createList(){
  listFormState={mode:'create-list'};renderLists('side');
  setTimeout(()=>{const el=document.getElementById('lf-new-list');if(el)el.focus();},30);
}
function submitNewList(){
  const inp=document.getElementById('lf-new-list');if(!inp)return;
  const name=inp.value.trim()||'New List';
  S.lists.push({id:genId(),name,open:true,items:[]});
  listFormState=null;sched();renderLists('side');
}
function deleteList(id){
  if(!confirm('Delete this list and everything in it?'))return;
  S.lists=S.lists.filter(l=>l.id!==id);sched();renderLists('side');
}
function toggleListOpen(id){
  const lst=S.lists.find(l=>l.id===id);if(!lst)return;lst.open=!lst.open;saveLocal();renderLists('side');
}

// List rename
function startListRename(id){
  listFormState={mode:'rename-list',id};renderLists('side');
  setTimeout(()=>{const el=document.getElementById('lf-rename-'+id);if(el){el.focus();el.select();}},30);
}
function submitListRename(id){
  const inp=document.getElementById('lf-rename-'+id);
  const lst=S.lists.find(l=>l.id===id);
  if(lst&&inp)lst.name=inp.value.trim()||lst.name;
  listFormState=null;sched();renderLists('side');
}

// ─── NODE CRUD ────────────────────────────────────────────────────────────────
let addingChildTo=null; // {listId, nodeId|null}  null=top-level
let editingNodeId=null;

function startAddNode(listId,parentNodeId){
  addingChildTo={listId,parentNodeId:parentNodeId||null};
  renderLists('side');
  setTimeout(()=>{const el=document.getElementById('node-add-inp');if(el)el.focus();},30);
}
function submitAddNode(){
  const inp=document.getElementById('node-add-inp');if(!inp||!inp.value.trim())return cancelAddNode();
  const lst=S.lists.find(l=>l.id===addingChildTo.listId);if(!lst)return;
  const newNode=makeNode(inp.value);
  if(!addingChildTo.parentNodeId){
    lst.items.push(newNode);
  } else {
    const parent=findNode(lst.items,addingChildTo.parentNodeId);
    if(parent){parent.children.push(newNode);parent.open=true;}
  }
  addingChildTo=null;sched();renderLists('side');
}
function cancelAddNode(){addingChildTo=null;renderLists('side');}

function startEditNode(nodeId){editingNodeId=nodeId;renderLists('side');setTimeout(()=>{const el=document.getElementById('node-edit-'+nodeId);if(el){el.focus();el.select();}},20);}
function submitEditNode(listId,nodeId){
  const inp=document.getElementById('node-edit-'+nodeId);
  const lst=S.lists.find(l=>l.id===listId);
  if(lst&&inp){const n=findNode(lst.items,nodeId);if(n&&inp.value.trim())n.name=inp.value.trim();}
  editingNodeId=null;sched();renderLists('side');
}
function cancelEditNode(){editingNodeId=null;renderLists('side');}

function deleteNode(listId,nodeId){
  const lst=S.lists.find(l=>l.id===listId);if(!lst)return;
  removeNode(lst.items,nodeId);sched();renderLists('side');
}
function toggleNodeOpen(listId,nodeId){
  const lst=S.lists.find(l=>l.id===listId);if(!lst)return;
  const n=findNode(lst.items,nodeId);if(n){n.open=!n.open;saveLocal();renderLists('side');}
}
function toggleNodeDone(listId,nodeId){
  const lst=S.lists.find(l=>l.id===listId);if(!lst)return;
  const n=findNode(lst.items,nodeId);if(!n)return;
  setChecked(n,!n.done);
  syncNodeParents(lst.items);
  sched();renderLists('side');
}

// Indent: move node under previous sibling
function indentNode(listId,nodeId){
  const lst=S.lists.find(l=>l.id===listId);if(!lst)return;
  const parent=findParent(lst.items,nodeId);
  const siblings=parent?parent.children:lst.items;
  const idx=siblings.findIndex(n=>n.id===nodeId);
  if(idx<1)return; // nothing above to indent under
  const node=siblings[idx];
  siblings.splice(idx,1);
  const newParent=siblings[idx-1];
  newParent.children.push(node);
  newParent.open=true;
  sched();renderLists('side');
}
// Outdent: move node up to grandparent level
function outdentNode(listId,nodeId){
  const lst=S.lists.find(l=>l.id===listId);if(!lst)return;
  const parent=findParent(lst.items,nodeId);
  if(!parent)return; // already top level
  const grandparent=findParent(lst.items,parent.id);
  const parentSiblings=grandparent?grandparent.children:lst.items;
  const nodeIdx=parent.children.findIndex(n=>n.id===nodeId);
  const node=parent.children[nodeIdx];
  parent.children.splice(nodeIdx,1);
  const parentIdx=parentSiblings.findIndex(n=>n.id===parent.id);
  parentSiblings.splice(parentIdx+1,0,node);
  sched();renderLists('side');
}

// ─── RENDER LISTS ─────────────────────────────────────────────────────────────
let listFormState=null;

function renderLists(ctx){
  const container=ctx==='side'?document.getElementById('side-lists'):document.getElementById('mobile-panel-inner');
  if(!container)return;

  let html=`<div class="lb-section-header"><h3>My Lists</h3><button class="lb-new-btn" onclick="createList()">+</button></div>`;

  if(listFormState?.mode==='create-list'){
    html+=`<div class="inline-name-row">
      <input id="lf-new-list" type="text" placeholder="List name…" maxlength="60"
        onkeydown="if(event.key==='Enter')submitNewList();if(event.key==='Escape'){listFormState=null;renderLists('side');}event.stopPropagation();">
      <button onclick="submitNewList()">Create</button>
      <button class="cancel-btn" onclick="listFormState=null;renderLists('side')">✕</button>
    </div>`;
  }

  if(!S.lists.length){
    html+=`<div style="font-size:12px;color:var(--dimmer);padding:8px 0">No lists yet — hit + to create one.</div>`;
  } else {
    S.lists.forEach(lst=>{
      syncNodeParents(lst.items);
      const{total,done}=countNodes(lst.items);
      const isRenamingThis=listFormState?.mode==='rename-list'&&listFormState?.id===lst.id;

      html+=`<div class="lcard${lst.open?' open':''}">
        <div class="lcard-header" onclick="toggleListOpen('${lst.id}')">
          <span class="lcard-toggle">${lst.open?'▾':'▸'}</span>
          ${isRenamingThis
            ?`<div onclick="event.stopPropagation()" style="flex:1;display:flex;gap:4px;">
                <input id="lf-rename-${lst.id}" type="text" value="${esc(lst.name)}" maxlength="60"
                  style="flex:1;background:var(--surface3);border:1px solid var(--accent);border-radius:3px;color:var(--text);font-size:12px;padding:3px 6px;outline:none;"
                  onkeydown="if(event.key==='Enter')submitListRename('${lst.id}');if(event.key==='Escape'){listFormState=null;renderLists('side');}event.stopPropagation();">
                <button class="lcard-btn" onclick="submitListRename('${lst.id}')">✓</button>
              </div>`
            :`<span class="lcard-name">${esc(lst.name)}</span>`
          }
          <span class="lcard-count">${done}/${total}</span>
          <div class="lcard-actions" onclick="event.stopPropagation()">
            <button class="lcard-btn" onclick="startListRename('${lst.id}')" title="Rename">✎</button>
            <button class="lcard-btn" onclick="startAddNode('${lst.id}',null)" title="Add item">+</button>
            <button class="lcard-btn del" onclick="deleteList('${lst.id}')" title="Delete">×</button>
          </div>
        </div>
        <div class="lcard-body">
          <div class="outline-hint">Tab = indent · Shift+Tab = outdent · double-click = edit</div>
          ${renderNodes(lst.items,lst.id,null)}
          ${addingChildTo?.listId===lst.id&&!addingChildTo.parentNodeId?renderAddNodeForm(lst.id,null):''}
          ${!addingChildTo||addingChildTo.listId!==lst.id||addingChildTo.parentNodeId?
            `<div style="margin-top:4px;">
              <button class="lcard-btn" onclick="startAddNode('${lst.id}',null)" style="font-size:11px;color:var(--dim);border:1px dashed var(--border);border-radius:3px;padding:3px 8px;width:100%;text-align:left;">+ Add item</button>
            </div>`:''}
        </div>
      </div>`;
    });
  }

  container.innerHTML=html;

  // Focus add node input if open
  if(addingChildTo){setTimeout(()=>{const el=document.getElementById('node-add-inp');if(el)el.focus();},20);}
  if(listFormState?.mode==='rename-list'){setTimeout(()=>{const el=document.getElementById('lf-rename-'+listFormState.id);if(el){el.focus();el.select();}},20);}
}

function renderAddNodeForm(listId,parentNodeId){
  return`<div class="node-add-row" style="${parentNodeId?'':'margin-left:0;'}">
    <input id="node-add-inp" type="text" placeholder="Item name…" maxlength="200"
      onkeydown="if(event.key==='Enter')submitAddNode();if(event.key==='Escape')cancelAddNode();event.stopPropagation();">
    <button onclick="submitAddNode()">+</button>
    <button class="cancel-btn" onclick="cancelAddNode()">✕</button>
  </div>`;
}

function renderNodes(nodes,listId,parentId){
  if(!nodes.length)return'';
  let html='<div class="tree-children" style="display:block;margin-left:0;border-left:none;">';
  nodes.forEach(node=>{
    const hasKids=node.children.length>0;
    const isEditing=editingNodeId===node.id;
    const isAddingUnder=addingChildTo?.listId===listId&&addingChildTo?.parentNodeId===node.id;

    html+=`<div class="tree-node${node.open?' open':''}" id="tn-${node.id}">
      <div class="node-row">
        <span class="node-toggle${hasKids?'':'leaf'}" onclick="${hasKids?`toggleNodeOpen('${listId}','${node.id}')`:''}">${hasKids?(node.open?'▾':'▸'):''}</span>
        <input type="checkbox" class="node-cb" ${node.done?'checked':''} ${node._indeterminate?'data-indet="1"':''}
          onchange="toggleNodeDone('${listId}','${node.id}')"
          ${node._indeterminate?`style="opacity:.6"`:''}
          onclick="if(this.dataset.indet){this.checked=true;this.dataset.indet='';}"
        >
        ${isEditing
          ?`<input id="node-edit-${node.id}" class="node-input" type="text" value="${esc(node.name)}" maxlength="200"
              onkeydown="if(event.key==='Enter')submitEditNode('${listId}','${node.id}');if(event.key==='Escape')cancelEditNode();
              if(event.key==='Tab'&&!event.shiftKey){event.preventDefault();indentNode('${listId}','${node.id}');}
              if(event.key==='Tab'&&event.shiftKey){event.preventDefault();outdentNode('${listId}','${node.id}');}
              event.stopPropagation();"
              onblur="submitEditNode('${listId}','${node.id}')">`
          :`<span class="node-label${node.done?' done':''}" ondblclick="startEditNode('${node.id}')">${esc(node.name)}</span>`
        }
        <div class="node-actions">
          <button class="node-action-btn" onclick="startAddNode('${listId}','${node.id}')" title="Add child">+</button>
          <button class="node-action-btn" onclick="indentNode('${listId}','${node.id}')" title="Indent">→</button>
          <button class="node-action-btn" onclick="outdentNode('${listId}','${node.id}')" title="Outdent">←</button>
          <button class="node-action-btn" onclick="startEditNode('${node.id}')" title="Edit">✎</button>
          <button class="node-action-btn del" onclick="deleteNode('${listId}','${node.id}')" title="Delete">×</button>
        </div>
      </div>
      ${isAddingUnder?renderAddNodeForm(listId,node.id):''}
      <div class="tree-children" style="${node.open&&hasKids?'display:block':'display:none'}">
        ${renderNodes(node.children,listId,node.id)}
        ${isAddingUnder?'':''}
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

// ─── SIDEBAR / MOBILE ─────────────────────────────────────────────────────────
function showSideTab(t){
  currentSideTab=t;
  document.getElementById('side-lists').style.display=t==='lists'?'block':'none';
  document.getElementById('side-notes-panel').style.display=t==='notes'?'block':'none';
  document.getElementById('stab-lists').classList.toggle('active',t==='lists');
  document.getElementById('stab-notes').classList.toggle('active',t==='notes');
  if(t==='notes')renderSideNotes();
}
function mobileTab(tab){
  currentMobileTab=tab;
  ['lists','notes'].forEach(t=>document.getElementById('mnav-'+t)?.classList.toggle('active',t===tab));
  const mp=document.getElementById('mobile-panel'),mn=document.getElementById('main');
  if(tab==='notes'){mp.style.display='none';mn.style.display='flex';}
  else{mp.style.display='flex';mn.style.display='none';renderLists('mob');}
}

// ─── START ────────────────────────────────────────────────────────────────────
load();
showSideTab('lists');
if(window.innerWidth<=700)mobileTab('lists');
</script>
